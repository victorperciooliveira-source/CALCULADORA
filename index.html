<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        h1.nome-usuario {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .calculadora {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 320px; /* Aumentado ligeiramente para dar mais espaço */
        }

        .titulo-calc {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: left;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
        }

        #resultado {
            background-color: rgba(0, 0, 0, 0.3);
            width: 100%;
            height: 70px; /* Mais alto para números grandes */
            margin-bottom: 20px;
            font-size: 26px; /* Tamanho ajustado para não quebrar */
            color: #00ffcc;
            text-align: right;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: monospace;
            /* ESSENCIAL: Permite rolar para o lado se o número for gigante */
            overflow-x: auto;
            white-space: nowrap;
            word-wrap: normal;
        }

        /* Linha de código para sumir com a barra de rolagem horizontal feia */
        #resultado::-webkit-scrollbar {
            height: 4px;
        }
        #resultado::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 204, 0.2);
            border-radius: 10px;
        }

        table {
            border-collapse: separate;
            border-spacing: 8px;
            width: 100%;
        }

        .botao {
            width: 58px;
            height: 58px;
            font-size: 22px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            border-radius: 16px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .botao:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .botao:active {
            transform: translateY(1px);
        }

        .botao-op {
            background-color: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
        }
        .botao-op:hover {
            background-color: #ff9f0a;
            color: #fff;
        }

        .botao-clean {
            background-color: rgba(255, 69, 58, 0.15);
            color: #ff453a;
        }
        .botao-clean:hover {
            background-color: #ff453a;
            color: #fff;
        }

        .botao-igual {
            background: linear-gradient(135deg, #00eceb, #0099ff);
            color: #fff;
            font-weight: bold;
        }
        .botao-igual:hover {
            background: linear-gradient(135deg, #00ffff, #00bfff);
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.4);
        }
    </style>
</head>
<body>

    <h1 class="nome-usuario">Victor</h1>

    <div class="calculadora">
        <div class="titulo-calc">Calculadora</div>
        <p id="resultado"></p>
        
        <table>
            <tr>
                <td><button class="botao botao-clean" onclick="clean()">C</button></td>
                <td><button class="botao botao-op" onclick="back()">&lt;</button></td>
                <td><button class="botao botao-op" onclick="insert('/')">/</button></td>
                <td><button class="botao botao-op" onclick="insert('*')">×</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="insert('7')">7</button></td>
                <td><button class="botao" onclick="insert('8')">8</button></td>
                <td><button class="botao" onclick="insert('9')">9</button></td>
                <td><button class="botao botao-op" onclick="insert('-')">-</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="insert('4')">4</button></td>
                <td><button class="botao" onclick="insert('5')">5</button></td>
                <td><button class="botao" onclick="insert('6')">6</button></td>
                <td><button class="botao botao-op" onclick="insert('+')">+</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="insert('1')">1</button></td>
                <td><button class="botao" onclick="insert('2')">2</button></td>
                <td><button class="botao" onclick="insert('3')">3</button></td>
                <td rowspan="2"><button class="botao botao-igual" style="height: 124px;" onclick="calcular()">=</button></td>
            </tr>
            <tr>
                <td colspan="2"><button class="botao" style="width: 124px;" onclick="insert('0')">0</button></td>
                <td><button class="botao" onclick="insert('.')">.</button></td>
            </tr>
        </table>
    </div>

    <script>
        // Variável de controle para saber se o resultado acabou de ser exibido
        let mostrandoResultado = false;

        function insert(num)
        {
            var visor = document.getElementById('resultado');
            
            // Se der erro ou o usuário digitar um número logo após um resultado, ele limpa a tela para começar nova conta
            if(visor.innerHTML === "Nada..." || visor.innerHTML === "Erro" || (mostrandoResultado && !isNaN(num))) {
                visor.innerHTML = num;
            } else {
                visor.innerHTML = visor.innerHTML + num;
            }
            mostrandoResultado = false;
            
            // Auto-rolagem para acompanhar números compridos enquanto digita
            visor.scrollLeft = visor.scrollWidth;
        }
        
        function clean()
        {
            document.getElementById('resultado').innerHTML = "";
            mostrandoResultado = false;
        }
        
        function back()
        {
            var visor = document.getElementById('resultado');
            if(visor.innerHTML === "Nada..." || visor.innerHTML === "Erro") {
                clean();
            } else {
                visor.innerHTML = visor.innerHTML.substring(0, visor.innerHTML.length - 1);
            }
        }
        
        function calcular()
        {
            var visor = document.getElementById('resultado');
            var expressao = visor.innerHTML;
            
            if(expressao && expressao !== "Nada..." && expressao !== "Erro")
            {
                try {
                    // Executa o cálculo básico
                    let conta = Function('"use strict";return (' + expressao + ')')();
                    
                    if (conta !== undefined && !isNaN(conta)) {
                        // Resolve o problema de aproximação do JS (ex: 0.1 + 0.2 não dar 0.3000000000004)
                        if (conta % 1 !== 0) {
                            // Se for decimal muito pequeno ou grande, limita a precisão para caber limpo
                            conta = parseFloat(conta.toPrecision(12));
                        }
                        visor.innerHTML = conta;
                        mostrandoResultado = true;
                    } else {
                        visor.innerHTML = "Erro";
                    }
                } catch(e) {
                    visor.innerHTML = "Erro";
                }
            }
            else
            {
                visor.innerHTML = "Nada...";
            }
        }
    </script>
</body>
</html>
